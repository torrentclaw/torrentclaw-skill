name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# ubuntu-latest everywhere, with no `container:` and no apt-get bootstrap: the
# Forgejo runner only offered a bare ubuntu image, so every job had to install
# git, grep, ca-certificates and shellcheck before it could do any work. The
# GitHub runner ships all of those.
jobs:
  lint-commits:
    name: Lint commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate conventional commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?(!)?: .{1,}$'

          failed=0
          while IFS= read -r first_line; do
            if ! echo "$first_line" | grep -qE "$pattern"; then
              echo "::error::Not a conventional commit: $first_line"
              failed=1
            fi
          done < <(git log --format="%s" "$BASE_SHA".."$HEAD_SHA")

          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "Some commits do not follow Conventional Commits format."
            echo "Expected: <type>[scope][!]: <description>"
            echo "See: https://www.conventionalcommits.org/"
            exit 1
          fi
          echo "All commits follow Conventional Commits format."

  lint-scripts:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

  security-check:
    name: Security patterns check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for unsafe string interpolation in curl payloads
        run: |
          # Flag inline JSON in double quotes (allows shell interpolation).
          # Safe patterns: curl -d '{}' (single quotes) or curl -d "$var" (pre-built payload).
          if grep -rPn 'curl.*-d\s*"[{]' scripts/*.sh; then
            echo ""
            echo "::error::Found curl -d with inline JSON in double quotes."
            echo "Use jq --arg to build JSON safely and pass via variable."
            exit 1
          fi
          echo "No unsafe curl patterns found."
